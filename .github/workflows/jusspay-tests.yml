name: JussPay isolated security tests
on:
  push:
    branches:
      - chore/payment-safety-contract-20261029
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/jusspay-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Behavior tests
        run: npm test
