name: JussPay monetization tests
on:
  pull_request:
    paths:
      - 'monetization/**'
      - '.github/workflows/monetization-tests.yml'
  push:
    paths:
      - 'monetization/**'
      - '.github/workflows/monetization-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monetization
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check Worker
        run: node --check src/worker.mjs
      - name: Run isolated local payment tests
        run: npm test